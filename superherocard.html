<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Superhero Card</title>
<style>
    
    body {
        background-color: rgb(59, 59, 108);
        color: white;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    .hero-name {
    text-shadow: 3px 3px lightblue;
  font-family: Arial, sans-serif;
  font-size: 60px;
  font-weight: bold;
  color: darkblue;
  font-style: italic;
}

.tagline {
    text-shadow: 2px 2px lightgray;
  font-family: Arial, sans-serif;
  font-size: 30px;
  color: cyan;
  margin-top: 10px;
}

.label {
  text-decoration: underline;
}
.weakness {
  text-decoration: line-through;
}

.power {
    text-shadow: 2px 2px lightgreen;
  font-family: Arial, sans-serif;
  font-weight: bold;
  color: purple;
}
.weakness {
    text-shadow: 2px 2px lightgray;
  text-decoration: line-through;
  color: rgb(13, 162, 255);
}

.badge {
  font-weight: italic;
  color: orange;
  transform: rotate(-10deg);
}

.made-by {
  font-size: 14px;
  color: gray;
  margin-top: 20px;
}

</style>
</head>

<body>
    <h1 class="hero-name">Thunderkid</h1>
    <p class="tagline">"The tagline of the superhero"</p>
    <p><span class="label">Power:</span> <span class="power">Super Strength</span></p>
    <p><span class="label">Weakness:</span> <span class="weakness">Kryptonite</span></p>
    <p><span class="badge">Badge: Hero of the Year</span></p>
    <p class="made-by">Made by: Tahmid</p>
